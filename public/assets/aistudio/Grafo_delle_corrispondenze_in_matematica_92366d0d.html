<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galassia Matematica</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/vis/4.21.0/vis.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/vis/4.21.0/vis.min.css"/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;700&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #06060f;
    --panel: #0d0d1f;
    --border: #1a1a3a;
    --text: #c8c8e8;
    --muted: #5a5a8a;
    --accent: #7b68ee;
    --gold: #d4af6a;
    --cyan: #4ecdc4;
    --rose: #e8708a;
    --green: #6bcb77;
    --orange: #f4a261;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'EB Garamond', Georgia, serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* starfield */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 20%, rgba(200,200,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 80%, rgba(200,200,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 50% 40%, rgba(200,200,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 60%, rgba(200,200,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 90% 10%, rgba(200,200,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 15% 50%, rgba(200,200,255,0.2) 0%, transparent 100%),
      radial-gradient(1px 1px at 80% 30%, rgba(200,200,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 45% 70%, rgba(200,200,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 60% 15%, rgba(200,200,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 25% 90%, rgba(200,200,255,0.2) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 10;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 20px;
    background: rgba(6,6,15,0.9);
    backdrop-filter: blur(8px);
  }

  .title-block h1 {
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--gold);
  }

  .title-block p {
    font-size: 0.75rem;
    font-family: 'JetBrains Mono', monospace;
    color: var(--muted);
    margin-top: 2px;
  }

  .legend {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-left: auto;
    align-items: center;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.7rem;
    font-family: 'JetBrains Mono', monospace;
    color: var(--muted);
    cursor: pointer;
    padding: 3px 8px;
    border-radius: 3px;
    border: 1px solid transparent;
    transition: all 0.2s;
  }

  .legend-item:hover { border-color: var(--border); color: var(--text); }

  .legend-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  #network {
    flex: 1;
    position: relative;
    z-index: 1;
  }

  /* info panel */
  #info-panel {
    position: fixed;
    right: 16px;
    top: 70px;
    width: 300px;
    background: rgba(13,13,31,0.95);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 18px;
    z-index: 20;
    backdrop-filter: blur(12px);
    opacity: 0;
    transform: translateX(20px);
    transition: all 0.25s ease;
    pointer-events: none;
    max-height: calc(100vh - 100px);
    overflow-y: auto;
  }

  #info-panel.visible {
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
  }

  #info-panel h2 {
    font-size: 1rem;
    font-weight: 600;
    color: var(--gold);
    margin-bottom: 6px;
    line-height: 1.3;
  }

  #info-panel .category {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 10px;
  }

  #info-panel p {
    font-size: 0.82rem;
    line-height: 1.6;
    color: #a0a0cc;
    margin-bottom: 10px;
  }

  #info-panel .connections {
    font-size: 0.72rem;
    font-family: 'JetBrains Mono', monospace;
    color: var(--muted);
  }

  #info-panel .connections span {
    display: block;
    margin: 3px 0;
    color: var(--cyan);
  }

  #info-panel .bridge-badge {
    display: inline-block;
    background: rgba(212,175,106,0.15);
    border: 1px solid rgba(212,175,106,0.4);
    color: var(--gold);
    font-size: 0.65rem;
    font-family: 'JetBrains Mono', monospace;
    padding: 2px 8px;
    border-radius: 3px;
    margin-bottom: 10px;
  }

  .controls {
    position: fixed;
    left: 16px;
    bottom: 16px;
    z-index: 20;
    display: flex;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    color: var(--muted);
    align-items: center;
  }

  .controls kbd {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 2px 6px;
    border-radius: 3px;
  }

  #close-panel {
    position: absolute;
    top: 10px; right: 12px;
    background: none; border: none;
    color: var(--muted); cursor: pointer;
    font-size: 1rem;
    line-height: 1;
  }
  #close-panel:hover { color: var(--text); }
</style>
</head>

      gravitationalConstant: -8000,
      centralGravity: 0.3,

  layout: { improvedLayout: true },
  nodes: { scaling: { min: 10, max: 40 } },
  edges: { scaling: { min: 1, max: 4 }, length: 200 }
};

const network = new vis.Network(container, data, options);

// Info panel
const panel = document.getElementById('info-panel');
const panelContent = document.getElementById('panel-content');

network.on('click', function(params) {
  if (params.nodes.length > 0) {
    const nodeId = params.nodes[0];
    const node = visNodes.get(nodeId);
    const info = node._info;
    if (!info) return;

    let html = '';
    if (node._bridge) html += `<div class="bridge-badge">⭐ PONTE / ISOMORFISMO</div>`;
    html += `<h2>${info.title}</h2>`;
    html += `<div class="category">${info.cat}</div>`;
    html += `<p>${info.desc}</p>`;
    if (info.links && info.links.length > 0) {
      html += `<div class="connections">Connessioni:<br>`;
      info.links.forEach(l => { html += `<span>${l}</span>`; });
      html += `</div>`;
    }

    panelContent.innerHTML = html;
    panel.classList.add('visible');
    network.selectNodes([nodeId]);
  } else {
    panel.classList.remove('visible');
    network.unselectAll();
  }
});

network.on('hoverNode', () => { container.style.cursor = 'pointer'; });
network.on('blurNode', () => { container.style.cursor = 'default'; });

document.getElementById('close-panel').addEventListener('click', () => {
  panel.classList.remove('visible');
  network.unselectAll();
});

// After stabilization, disable physics slightly for smoother interaction
network.on('stabilizationIterationsDone', () => {
  network.setOptions({ physics: { barnesHut: { gravitationalConstant: -5000 } } });
});
