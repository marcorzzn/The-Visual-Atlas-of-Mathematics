## Logica Classica
- Sillogismo
  - Argomentazione
- Accetta il principio del terzo escluso

## Logica Intuizionista
- Restringe la logica classica
  - Rigetta il terzo escluso
- Logica Lineare (Girard 1987)
  - Restringe ulteriormente l'intuizionista
  - Controlla l'uso delle risorse logiche
 
## Logica Matematica
### Studia
- Analisi combinatoria dell'infinito e delle enumerazioni
- Teoria dei modelli
- Teoria della dimostrazione
- Teoria della ricorsione
- Teoria degli insiemi

### Sintassi
- Linguaggio formale
  - Calcolatore

### Semantica
- Costruisce modelli o insiemi di strutture
  - Lambda calcolo / Logica combinatoria
    - Linguaggi di programmazione funzionali
  - Dimostatori automatici dei teoremi
    - Programmazione logica
  - Isomorfismo di Curry–Howard
    - Corrispondenza tra dimostrazioni e programmi

### Logica Proposizionale: linguaggio formale
#### Proposizioni elementari (Atomi)
- Valore di verità
  - Determinato dal valore delle proposizioni connesse
- Funzione di valutazione
  - Condizioni riassumibili nella tavola di verità

#### Connettivi logici (vero-funzionali)
- `AND`
- `OR`
- `NOT`

#### Formule Ben Formate (FBF)
- **Soddisfacibile** — vera per almeno un'assegnazione
- **Contraddizione** — falsa per ogni assegnazione
- **Tautologia** — vera per ogni assegnazione
- Grammatica scrivibile in **Backus–Naur Form (BNF)**



### Teoria del Primo Ordine
#### Calcolo dei Predicati (sistema formale)
- **Estende** la Logica Proposizionale con quantificatori
  - Esistenziale $\exists$
  - Universale $\forall$

#### Costituita da
- **Alfabeto** — insieme di simboli
- **Linguaggio del primo ordine** — insieme delle FBF
- Insieme di assiomi logici
- Insieme di assiomi propri
- Insieme di regole di inferenza
