load":{"tag":"li","lines":"298,299"}}],"payload":{"tag":"li","lines":"288,299"}},{"content":"Anassagora (c. 500&#x2013;428 a.C.): tentativo di quadrare il cerchio in prigione","children":[],"payload":{"tag":"li","lines":"299,300"}},{"content":"Democrito (c. 460&#x2013;370 a.C.): volume del cono e della piramide (1/3 del cilindro/prisma circoscritto, senza dimostrazione rigorosa ma concetto atomistico)","children":[],"payload":{"tag":"li","lines":"300,301"}},{"content":"Ippocrate di Chio (c. 440 a.C.): quadratura delle lunule; primo &quot;Elementi di geometria&quot; (perduto)","children":[],"payload":{"tag":"li","lines":"301,302"}},{"content":"Teodoro di Cirene (c. 400 a.C.): irrazionalit&#xe0; di &#x221a;3, &#x221a;5, ..., &#x221a;17","children":[],"payload":{"tag":"li","lines":"302,303"}},{"content":"Archita di Taranto (c. 400 a.C.): duplicazione del cubo tramite intersezione di superfici (curva di Archita); fondatore della meccanica matematica","children":[],"payload":{"tag":"li","lines":"303,304"}}],"payload":{"tag":"li","lines":"281,304"}},{"content":"Platone (427&#x2013;347 a.C.) e l&apos;Accademia","children":[{"content":"Ruolo della matematica come propedeutica filosofica; forme ideali, dianoia","children":[],"payload":{"tag":"li","lines":"305,306"}},{"content":"&quot;Nessuno entri che non sia geometra&quot;","children":[],"payload":{"tag":"li","lines":"306,307"}},{"content":"5 solidi platonici (tetraedro, cubo, ottaedro, dodecaedro, icosaedro) e loro associazione agli elementi (Timeo)","children":[],"payload":{"tag":"li","lines":"307,308"}},{"content":"Problema di Delo (duplicazione del cubo)","children":[],"payload":{"tag":"li","lines":"308,309"}},{"content":"Metodo analitico (analisi e sintesi)","children":[],"payload":{"tag":"li","lines":"309,310"}},{"content":"Teeteto (c. 417&#x2013;369 a.C.)","children":[{"content":"Costruzione dell&apos;ottaedro e icosaedro regolari","children":[],"payload":{"tag":"li","lines":"311,312"}},{"content":"Classificazione de
